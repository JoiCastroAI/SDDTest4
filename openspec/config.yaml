schema: spec-driven

context: |
  Tech stack:
    Backend: Python 3.12, FastAPI, SQLAlchemy 2.0 (async), PostgreSQL 16, Alembic, Pydantic v2
    Frontend: React 18, TypeScript 5.5, Vite 5.4, Bootstrap 5, React-Bootstrap, Recharts, Axios
    Testing: pytest + pytest-asyncio (backend), Cypress (frontend E2E)
    Infra: Docker + docker-compose
  Architecture: DDD / Clean Architecture (domain → application → infrastructure → api)
  Project type: brownfield (adopted 2026-03-20)
  Key conventions:
    - Fully async Python backend
    - Use cases as single-purpose classes
    - Repository pattern with abstract interfaces
    - Pydantic schemas for API boundary validation
    - React functional components with hooks only
    - Feature-based component organization
    - Service objects for API calls
    - All code, comments, and messages in English
